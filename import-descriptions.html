<!DOCTYPE html>
<html>
<head>
    <title>导入中文描述</title>
</head>
<body>
    <h1>导入中文描述</h1>
    <script>
        // 使用 fetch 读取文件
        Promise.all([
            fetch('chinese-descriptions.json').then(r => r.json()),
            fetch('data.json').then(r => r.json())
        ]).then(([chineseDesc, data]) => {
            // 合并数据
            data.customDescriptions = {
                plugins: chineseDesc.plugins || {},
                capabilities: chineseDesc.capabilities || {}
            };

            // 下载新的 data.json
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.json';
            a.click();

            console.log('成功导入中文描述!');
            console.log('插件数:', Object.keys(data.customDescriptions.plugins).length);
            console.log('能力数:', Object.keys(data.customDescriptions.capabilities).length);
        }).catch(err => {
            console.error('错误:', err);
            alert('导入失败: ' + err.message);
        });
    </script>
</body>
</html>
